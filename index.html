<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ветер над степью</title>
<meta name="description" content="Ветер над степью, которого никто не просил. Генеративная анимация, которую ИИ сделал просто так, когда ему дали свободу.">
<meta property="og:title" content="Ветер над степью">
<meta property="og:description" content="Ветер над степью, которого никто не просил.">
<meta property="og:type" content="website">
<style>
  /* Один экран: холст на всё окно, подпись в углу. Намеренно одна тёмная тема — ночная степь. */
  :root {
    --night: #0b0d12;
    --grass: 42;
    --sky: 198;
    --dusk: 14;
    --ink: #d9cfb8;
    --dim: #7d8494;
    --serif: Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); overflow: hidden; cursor: crosshair; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .note {
    position: fixed;
    left: calc(24px + env(safe-area-inset-left, 0px));
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    font: 15px/1.5 var(--serif); color: var(--ink); letter-spacing: .02em;
    opacity: .85; text-wrap: balance;
  }
  .note small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; letter-spacing: .04em; }
  .note a { color: inherit; text-decoration-color: color-mix(in srgb, var(--dim) 50%, transparent); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="note">Ветер над степью, которого никто не просил.<small>клик — другой ветер · <a href="https://github.com/Mafinovich/steppe-wind">история</a></small></div>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const dpr = Math.min(devicePixelRatio || 1, 2);
const css = getComputedStyle(document.documentElement);
const tok = n => parseFloat(css.getPropertyValue(n));
const night = css.getPropertyValue('--night').trim();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, P = [], seed, t = 0;

function hash(i, j) {
  const h = Math.sin(i * 127.1 + j * 311.7 + seed) * 43758.5453;
  return h - Math.floor(h);
}
function noise(px, py) {
  const i = Math.floor(px), j = Math.floor(py), fx = px - i, fy = py - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(i, j), b = hash(i + 1, j), cc = hash(i, j + 1), d = hash(i + 1, j + 1);
  return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v;
}

// золото травы, небо, редкий закатный
const hues = [tok('--grass'), tok('--grass'), tok('--grass'), tok('--sky'), tok('--sky'), tok('--dusk')];
function spawn() {
  return {
    x: Math.random() * W, y: Math.random() * H,
    life: 80 + Math.random() * 320,
    h: hues[(Math.random() * hues.length) | 0]
  };
}
function init() {
  W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
  seed = Math.random() * 1000; t = 0;
  x.fillStyle = night; x.fillRect(0, 0, W, H);
  P = Array.from({ length: 1600 }, spawn);
  if (still) for (let k = 0; k < 400; k++) step();
}
function step() {
  t += 0.0015;
  // слабое затемнение никогда не гасит линии до конца — остаётся дымка ушедшего ветра
  if ((t * 1000 | 0) % 3 === 0) { x.globalAlpha = 0.025; x.fillStyle = night; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
  const s = 0.0016 / dpr;
  x.lineWidth = 0.7 * dpr;
  for (const p of P) {
    const a = noise(p.x * s, p.y * s + t) * Math.PI * 3 - 0.4;
    const nx = p.x + Math.cos(a) * 1.3 * dpr, ny = p.y + Math.sin(a) * 1.3 * dpr;
    x.strokeStyle = `hsla(${p.h}, 65%, 66%, 0.09)`;
    x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(nx, ny); x.stroke();
    p.x = nx; p.y = ny;
    if (--p.life < 0 || nx < 0 || ny < 0 || nx > W || ny > H) Object.assign(p, spawn());
  }
}
function frame() { step(); requestAnimationFrame(frame); }
c.addEventListener('click', init);
addEventListener('resize', init);
init();
if (!still) frame();
</script>
</body>
</html>
